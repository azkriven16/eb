name: CI/CD

on:
  push:
    branches: [main, "**"] # All branches including main
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-preview-deploy:
    runs-on: ubuntu-latest
    environment: production # Optional: protect secrets

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for Wrangler versions

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # 3. Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      # 4. Get pnpm store path
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 5. Cache pnpm store
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 6. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 7. Lint
      - name: Run lint
        run: pnpm lint

      # 8. Build & Preview (simulate local preview)
      - name: Build and preview
        run: pnpm preview
        env:
          # Prevent interactive prompts
          CI: true

      # 9. Deploy logic
      - name: Deploy to Cloudflare (main branch)
        if: github.ref == 'refs/heads/main'
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy branch version (non-main branches)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: pnpm deploy:branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: tag with branch name
          WRANGLER_VERSION_NAME: ${{ github.ref_name }}
