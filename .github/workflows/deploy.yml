name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext
        timeout-minutes: 10
        env:
          DEBUG: "opennext*"
        run: |
          echo "Starting build..."
          pnpm build || (echo "Build failed. Last 100 lines:" && tail -100 .open-next/build.log && exit 1)

      - name: Install jq (for preview URLs)
        if: github.ref != 'refs/heads/main'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            ${{ github.ref == 'refs/heads/main' 
                && 'deploy --name eb' 
                || 'versions upload --branch ${{ github.ref_name }} --name eb --message \"Deploy from GitHub Actions\"' }}

      - name: Save deploy output
        if: github.ref != 'refs/heads/main'
        run: |
          echo '${{ steps.deploy.outputs.stdout }}' > deploy-output.json
          cat deploy-output.json

      - name: Output URLs
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "PRODUCTION LIVE: https://portfolio.euger.workers.dev"
            echo "Dashboard: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/eb/production"
          else
            VERSION_ID=$(jq -r '.version_id // empty' deploy-output.json)
            if [ -n "$VERSION_ID" ]; then
              echo "PREVIEW URL: https://$VERSION_ID.eb.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
            else
              echo "PREVIEW URL: Not available"
            fi
            echo "Dashboard: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/eb/versions"
          fi
