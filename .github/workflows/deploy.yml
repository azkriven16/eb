name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with OpenNext
        run: pnpm build

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .open-next
          command: >-
            ${{ github.ref == 'refs/heads/main' 
                && 'deploy --name eb' 
                || 'versions upload --branch ${{ github.ref_name }} --name eb' }}

      - name: Output URLs
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "PRODUCTION LIVE: https://portfolio.euger.workers.dev"
          else
            BRANCH="${{ github.ref_name }}"
            echo "PREVIEW URL: https://$BRANCH.portfolio.euger.workers.dev"
            echo "Dashboard: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/eb/versions"
          fi
