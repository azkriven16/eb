name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # If you use OpenNext, this should be: npx open-next build
        # Confirm your package.json has: "build": "open-next build"

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # For main → full deploy, else → preview version
          command: >-
            ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload --branch ${{ github.ref_name }}' }}

      - name: Output Deployment URL
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🚀 Production deployed: https://portfolio.euger.workers.dev"
          else
            echo "Preview: https://${{ github.ref_name }}.portfolio.euger.workers.dev"
            echo "View logs: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/view/eb/versions"
          fi
