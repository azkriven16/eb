name: CI/CD

# Run on every push (any branch) and on PRs to main
on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-preview-deploy:
    runs-on: ubuntu-latest
    environment: production # protects secrets

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for wrangler versions

      # 2. Set up Node (caches npm modules automatically)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # change if you use another LTS
          cache: "npm" # caches node_modules + npm cache

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci # uses package-lock.json → reproducible

      # 4. Lint
      - name: Lint
        run: npm run lint

      # 5. Build & Preview (fails if build breaks)
      - name: Build and preview
        run: npm run preview
        env:
          CI: true # avoid interactive prompts

      # 6. Deploy to production (only on main)
      - name: Deploy to Cloudflare (main)
        if: github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 7. Deploy branch preview (any other branch, push only)
      - name: Deploy branch version
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          PROJECT_NAME=$(node -p "require('./package.json').name")
          npx wrangler versions upload --name "$PROJECT_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION_NAME: ${{ github.ref_name }}
