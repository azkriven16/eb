name: CI/CD

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Node (npm cache)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # <-- npm cache (no lock-file required for cache)

      # 3. Install deps (npm ci will create package-lock.json if missing)
      - name: Install dependencies
        run: npm ci || npm install # fallback to npm install if lock missing

      # 4. Build + Preview (fails if build breaks)
      - name: Build and preview
        run: npm run preview
        env:
          CI: true

      # 5. Deploy to production (only main)
      - name: Deploy to Cloudflare (main)
        if: github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 6. Deploy branch preview (any other branch)
      - name: Deploy branch version
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          PROJECT_NAME=$(node -p "require('./package.json').name")
          npx wrangler versions upload --name "$PROJECT_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION_NAME: ${{ github.ref_name }}
